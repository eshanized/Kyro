version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "type: chore"
      - "area: ui"

  - package-ecosystem: "cargo"
    directory: "/libkyro"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "type: chore"
      - "area: core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "type: chore"
