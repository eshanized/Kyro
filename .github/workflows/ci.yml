name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Verification (Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test

      - name: Typecheck TypeScript (tsc)
        run: npx tsc --noEmit

      - name: Build production bundle (Vite)
        run: npm run build

  backend-check:
    name: Backend Verification (Rust fmt, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (for browser automation tests)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Symlink Node.js to /usr/local/bin
        run: sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "libkyro -> target"

      - name: Rust formatting check
        run: cargo fmt --manifest-path libkyro/Cargo.toml --all -- --check

      - name: Clippy linter
        run: cargo clippy --manifest-path libkyro/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run backend tests
        run: cargo test --manifest-path libkyro/Cargo.toml --all-features
